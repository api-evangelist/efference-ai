aid: efference-ai
name: Efference AI
description: Efference AI is a robotics perception and compute company building the hardware-plus-software
  foundation for data-driven robotics at scale. Founded in 2025 by Gianluca Bencomo and based in San Francisco
  (Y Combinator Fall 2025), Efference treats machine vision as a software problem, pairing affordable
  stereo-camera hardware with learned 3D-perception foundation models ("cheap hardware + great algorithms").
  Its M1 device targets distributed, robotics-grade data collection at scale, while the H1 stereo system is
  built for real-time cloud inference with foundation models. The company serves autonomous vehicles, humanoid
  robots, and drones, and publishes hardware-interfacing documentation and firmware through its GitHub
  organization. As of this profile Efference exposes no public developer API, OpenAPI, or authenticated
  service surface.
